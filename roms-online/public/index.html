<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ROMS ONLINE — Jogos retrô no navegador</title>
  <meta name="description" content="Descubra, salve e jogue clássicos retrô direto no navegador em uma interface minimalista.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
</head>
<body>
  <header class="top" id="top-header">
    <div class="top-in">
      <a class="logo" href="#/">ROMS<span>ONLINE</span></a>

      <div class="top-mobile-controls">
        <button class="btn ghost icon-btn" id="theme-toggle" type="button" aria-label="Alternar tema escuro">
          <span id="theme-icon" aria-hidden="true">☾</span>
          <span id="theme-label">Escuro</span>
        </button>
        <button class="burger" id="burger" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-drawer">☰</button>
      </div>

      <div class="nav-drawer" id="nav-drawer">
        <nav id="nav" aria-label="Principal">
          <a href="#/">Início</a>
          <a href="#/search">Explorar</a>
          <a href="#/consoles">Consoles</a>
          <a href="#/saved" id="nav-saved">Jogos Salvos <span class="badge" id="saved-count">0</span></a>
        </nav>

        <div class="top-actions" id="top-actions">
          <form class="sf" role="search">
            <input name="q" placeholder="Buscar jogos…" aria-label="Buscar jogos">
            <button class="btn" type="submit">Buscar</button>
          </form>

          <div id="auth-area" class="auth-area"></div>
        </div>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <footer class="foot">
    <div class="foot-in">
      <div>
        <strong>ROMS ONLINE</strong>
        <p class="dim">Catálogo por <a href="https://rawg.io" target="_blank" rel="noopener">RAWG</a>.</p>
      </div>
      <nav aria-label="Rodapé">
        <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
        <button class="lnk" type="button" data-dlg="credits">Créditos</button>
        <button class="lnk" type="button" data-dlg="privacy">Privacidade</button>
        <button class="lnk" type="button" data-dlg="terms">Termos</button>
      </nav>
    </div>
  </footer>

  <div id="toasts" role="status" aria-live="polite"></div>

  <!-- Modal informativo -->
  <dialog id="dlg">
    <div id="dc"></div>
    <form method="dialog" class="dlg-foot">
      <button class="btn ghost">Fechar</button>
    </form>
  </dialog>

  <!-- Modal de Login / Cadastro -->
  <dialog id="auth-dlg">
    <div class="auth-box">
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" data-auth-tab="login" role="tab" aria-selected="true">Entrar</button>
        <button type="button" class="auth-tab" data-auth-tab="register" role="tab" aria-selected="false">Cadastrar</button>
      </div>

      <form id="login-form" class="auth-form">
        <h2>Entrar na conta</h2>
        <p class="dim">Acesse seus jogos salvos em qualquer navegador.</p>
        <label>
          <span>E-mail</span>
          <input type="email" name="email" required placeholder="voce@exemplo.com" autocomplete="email">
        </label>
        <label>
          <span>Senha</span>
          <input type="password" name="password" required placeholder="••••••" autocomplete="current-password">
        </label>
        <p class="form-err" id="login-err" hidden></p>
        <div class="dlg-foot">
          <button type="button" class="btn ghost" id="close-auth-1">Cancelar</button>
          <button type="submit" class="btn">Entrar</button>
        </div>
      </form>

      <form id="register-form" class="auth-form" hidden>
        <h2>Criar conta</h2>
        <p class="dim">Cadastre-se gratuitamente para salvar seus jogos favoritos.</p>
        <label>
          <span>Nome</span>
          <input type="text" name="name" required minlength="2" placeholder="Seu nome" autocomplete="name">
        </label>
        <label>
          <span>E-mail</span>
          <input type="email" name="email" required placeholder="voce@exemplo.com" autocomplete="email">
        </label>
        <label>
          <span>Senha</span>
          <input type="password" name="password" required minlength="4" placeholder="Mínimo 4 caracteres" autocomplete="new-password">
        </label>
        <p class="form-err" id="register-err" hidden></p>
        <div class="dlg-foot">
          <button type="button" class="btn ghost" id="close-auth-2">Cancelar</button>
          <button type="submit" class="btn">Criar conta</button>
        </div>
      </form>
    </div>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
